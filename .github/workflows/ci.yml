name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Disable #error app-id gate (CI build only)
        run: |
          # SampleApp may ship `#error("insert your application_id here")` to force
          # SDK consumers to set a real app id. Comment it out so CI can build.
          # No-op when the directive is not present.
          sed -i '' -E 's@^([[:space:]]*)#error@\1// #error@' SampleApp/AppDelegate.swift

      - name: Install pods
        run: pod install

      - name: Build (simulator, no signing)
        run: |
          xcodebuild build \
            -workspace SampleApp.xcworkspace \
            -scheme SampleApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
