name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Select Xcode (from .xcode-version)
        run: |
          # macos-26 defaults to Xcode 26.5, which fails to resolve the prebuilt
          # OnfleetDriver.xcframework under explicit module builds. Pin to the
          # version in .xcode-version, resolving a partial (26.4) to the newest
          # installed patch (26.4.1).
          version="$(tr -d '[:space:]' < .xcode-version)"
          app="/Applications/Xcode_${version}.app"
          [ -d "$app" ] || app="$(ls -d /Applications/Xcode_${version}*.app | sort -V | tail -1)"
          echo "Using $app"
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version

      - name: Disable #error app-id gate (CI build only)
        run: |
          # SampleApp may ship `#error("insert your application_id here")` to force
          # SDK consumers to set a real app id. Comment it out so CI can build.
          # No-op when the directive is not present.
          sed -i '' -E 's@^([[:space:]]*)#error@\1// #error@' SampleApp/AppDelegate.swift

      - name: Cache CocoaPods
        id: cocoapods-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            Pods
            SampleApp.xcworkspace
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock', 'SampleApp.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install pods
        # Skipped on an exact cache hit, where Pods/ and the gitignored
        # SampleApp.xcworkspace are restored from the cache. On a miss or a
        # restore-keys partial restore this runs and regenerates the workspace
        # the build step needs. --deployment keeps CI reproducible: it errors if
        # Podfile.lock is out of sync with Podfile and never mutates the lock.
        if: steps.cocoapods-cache.outputs.cache-hit != 'true'
        run: pod install --deployment

      - name: Build (simulator, no signing)
        run: |
          xcodebuild build \
            -workspace SampleApp.xcworkspace \
            -scheme SampleApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
